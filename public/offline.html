<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18231e" />
    <title>GGTV | Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0c1511;
        color: #f3f5f3;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 0 16px;
      }
      img { display: block; width: 260px; max-width: 70vw; margin: 0 auto; }
      h1 { font-size: 20px; letter-spacing: 3px; margin: 24px 0 8px; }
      p { color: #93a29b; margin: 0 0 24px; }
      button {
        background: #ff7045;
        color: #0c1511;
        border: 0;
        border-radius: 6px;
        padding: 12px 22px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-dark.png" alt="GGTV" />
      <h1>NO CONNECTION</h1>
      <p>GGTV needs the internet to play the channel.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener('online', () => location.reload())
    </script>
  </body>
</html>
